components:
  schemas:
    AlbumTrack:
      type: object
      properties:
        collection_song_uuid:
          type: string
          format: uuid
          readOnly: true
        song_uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        position:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SongStatusEnum'
          readOnly: true
        status_detail:
          type: string
          readOnly: true
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: Client key of the album upload, so a repeated request finds
            the same row.
      required:
      - collection_song_uuid
      - operation_id
      - position
      - song_uuid
      - status
      - status_detail
      - title
    AlbumTrackCreateRequest:
      type: object
      description: |-
        The whole form of an album track upload: the song fields and the upload
        fields together. Only the schema uses it. The view checks the two parts
        one after the other, so it can find a repeated upload before it checks
        the song fields.
      properties:
        authors:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 128
        image:
          type:
          - string
          - 'null'
          format: binary
        description:
          type: string
          maxLength: 512
        operation_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        audio:
          type: string
          format: binary
      required:
      - audio
      - operation_id
      - position
      - title
    Attachment:
      oneOf:
      - $ref: '#/components/schemas/CollectionAttachment'
      - $ref: '#/components/schemas/SongAttachment'
      - $ref: '#/components/schemas/UserAttachment'
      discriminator:
        propertyName: type
        mapping:
          collection: '#/components/schemas/CollectionAttachment'
          song: '#/components/schemas/SongAttachment'
          user: '#/components/schemas/UserAttachment'
    BaseMe:
      type: object
      description: |-
        Read shape for `/users/me`. Extends `BaseUserSerializer` with the
        private `email` field and the user's own settings, which are only
        ever exposed to the authenticated owner of the account and must not
        leak through public user endpoints.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        date_added:
          type: string
          format: date-time
          readOnly: true
        date_modified:
          type: string
          format: date-time
          readOnly: true
        repr:
          type: string
          readOnly: true
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 2000
        avatar:
          type:
          - string
          - 'null'
          format: uri
        is_artist:
          type: boolean
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        loudness_normalization:
          type: boolean
      required:
      - avatar
      - bio
      - date_added
      - date_modified
      - display_name
      - email
      - is_artist
      - loudness_normalization
      - repr
      - uuid
    BaseRegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password1:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        is_artist:
          type: boolean
          writeOnly: true
          default: false
      required:
      - email
      - password1
      - password2
    BaseSongRetrieve:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        date_added:
          type: string
          format: date-time
          readOnly: true
        date_modified:
          type: string
          format: date-time
          readOnly: true
        repr:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 128
        image:
          type:
          - string
          - 'null'
          format: uri
        description:
          type: string
          maxLength: 512
        mpd:
          type: string
          readOnly: true
        m3u8:
          type: string
          readOnly: true
        authors:
          type: array
          items:
            $ref: '#/components/schemas/BaseUser'
          readOnly: true
        duration_ms:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        loudness_lufs:
          type:
          - number
          - 'null'
          format: double
        true_peak_dbtp:
          type:
          - number
          - 'null'
          format: double
      required:
      - authors
      - date_added
      - date_modified
      - description
      - duration_ms
      - image
      - loudness_lufs
      - m3u8
      - mpd
      - repr
      - title
      - true_peak_dbtp
      - uuid
