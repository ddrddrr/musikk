      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/collections:
    get:
      operationId: collections_list
      parameters:
      - in: query
        name: author
        schema:
          type: string
          format: uuid
      - in: query
        name: connection
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
            enum:
            - album
            - history
            - liked
            - playlist
        description: |-
          * `playlist` - Playlist
          * `album` - Album
          * `history` - History
          * `liked` - Liked songs
        explode: true
        style: form
      tags:
      - collections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionSerializerBasicList'
          description: ''
    post:
      operationId: collections_create
      tags:
      - collections
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionCreate'
          description: ''
