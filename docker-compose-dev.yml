name: musikk-dev

services:
  server:
    build:
      context: ./src/backend/
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: musikk.settings.prod
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - ${DJANGO_PORT}
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    networks:
      - main

  database:
    image: postgres:17
    env_file:
      - .env
    expose:
      - ${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - main

  celery_worker:
    build:
      context: ./src/backend/
      dockerfile: Dockerfile
    entrypoint: ["./start-celery-worker.sh"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: musikk.settings.prod
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    volumes:
      - django_media:/app/media
    networks:
      - main

  redis:
    image: redis:8.0-alpine
    command: [ "redis-server","--requirepass","${REDIS_PASSWORD}" ]
    expose:
      - 6379
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - main

  proxy:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src/frontend/docker/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - django_static:/app/staticfiles
      - django_media:/app/media
    networks:
      - main

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  django_static:
  django_media:

networks:
  main: