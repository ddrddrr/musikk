name: musikk-local

services:
  database:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main

  redis:
    image: redis:8.0-alpine
    command: [ "redis-server","--requirepass","${REDIS_PASSWORD}" ]
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    networks:
      - main

volumes:
  postgres_data:

networks:
  main: