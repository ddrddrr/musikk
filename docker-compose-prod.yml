name: musikk

# the server and the Celery worker run the same image. Only the server builds it, because Compose
# fails when two services build an image with the same name.
x-backend: &backend
  image: musikk-backend
  env_file:
    - .env.prod
  environment:
    DJANGO_SETTINGS_MODULE: musikk.settings.prod
    UPLOAD_TMP_DIR: /var/uploads_tmp
  restart: unless-stopped
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - main

services:
  server:
    <<: *backend
    build:
      context: ./src/backend/
      dockerfile: Dockerfile
    expose:
      - 8000
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - upload_tmp:/var/uploads_tmp
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health/" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  database:
    image: postgres:17
    command: [ "postgres", "-c", "max_connections=300" ]
    env_file:
      - .env.prod
    restart: unless-stopped
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - main

  celery_worker:
    <<: *backend
    entrypoint: [ "./start-celery-worker.sh" ]
    volumes:
      - django_media:/app/media
      - upload_tmp:/var/uploads_tmp

  redis:
    image: redis:8.0-alpine
    # $$ makes the container read the password from its env_file. With ${...}, Compose would take
    # REDIS_PASSWORD from the shell first, which may hold another value, for example from direnv.
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\"" ]
    expose:
      - 6379
    env_file:
      - .env.prod
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - main

  proxy:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE:-./src/frontend/Caddyfile.prod}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - django_static:/app/staticfiles
      - django_media:/app/media
    networks:
      - main

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  django_static:
  django_media:
  # mounted at /var rather than /tmp because the volume persists across
  # container restarts and /tmp can be cleared by OS whenever
  # (the hourly `cleanup_uploads` Celery task removes leftover files)
  upload_tmp:

networks:
  main:
